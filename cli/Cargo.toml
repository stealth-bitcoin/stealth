[package]
name = "stealth-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Detects UTXO privacy vulnerabilities in wallets"
categories = ["cryptography::cryptocurrencies"]
keywords = ["bitcoin", "privacy", "cli"]
exclude = ["tests"]

[dependencies]
ctrlc = "3.5.2"
serde = { workspace = true }
serde_json = { workspace = true }
stealth-bitcoincore = { path = "../bitcoincore" }
stealth-engine = { workspace = true }

[target.'cfg(unix)'.dependencies]
# Already in the tree through ctrlc: dies by SIGINT, tells foreground from background.
nix = { version = "0.31.3", default-features = false, features = ["process", "signal", "term"] }
# Already in the tree through nix: reads the SIGINT disposition, which nix cannot.
libc = "0.2.191"

[dev-dependencies]
corepc-node = { workspace = true }


[lints.rust]
missing_debug_implementations = "deny"
